<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vybora</title>
<script>
try {
  var t = localStorage.getItem("theme");
  if (t === "sombre" || (t === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.classList.add("sombre");
  }
} catch (e) {}
</script>
<style>
  :root {
    --fond:#fafafa; --carte:#ffffff; --texte:#262626; --bord:#dbdbdb;
    --gris:#efefef; --grisTexte:#737373; --champ:#fafafa; --bleuClair:#eef6ff;
  }
  :root.sombre {
    --fond:#121212; --carte:#1e1e1e; --texte:#f0f0f0; --bord:#333333;
    --gris:#2a2a2a; --grisTexte:#a3a3a3; --champ:#262626; --bleuClair:#1b2a3a;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding-bottom:72px; font-family:Arial,sans-serif; background:var(--fond); color:var(--texte); }
  input { color:var(--texte); background:var(--champ); font-family:inherit; }
  input::placeholder { color:var(--grisTexte); }
  svg { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .logo { font-weight:800; font-size:26px; color:#c13584; letter-spacing:-0.5px; cursor:pointer; }
  header { background:var(--carte); padding:8px 14px; display:flex; justify-content:space-between;
           align-items:center; border-bottom:1px solid var(--bord); position:sticky; top:0; z-index:5; }
  .tete-droite { display:flex; gap:8px; align-items:center; }
  header .btnTheme { width:36px; height:36px; font-size:16px; }
  .iconeTete { background:none; border:none; color:var(--texte); padding:6px; cursor:pointer; }
  .iconeTete svg { width:26px; height:26px; display:block; }
  .iconeTete.actif { color:#c13584; }

  .btnTheme { width:40px; height:40px; border-radius:50%; border:none; background:var(--gris);
              font-size:18px; cursor:pointer; flex-shrink:0; }
  .petitTheme { position:absolute; top:10px; right:10px; }

  #auth { position:relative; max-width:340px; margin:40px auto; padding:28px 22px;
          background:var(--carte); border:1px solid var(--bord); border-radius:10px; text-align:center; }
  #auth .logo { font-size:40px; margin:0 0 16px; cursor:default; }
  #auth input { width:100%; padding:11px; margin:5px 0;
                border:1px solid var(--bord); border-radius:6px; font-size:14px; }
  .btn { background:#0095f6; color:#fff; border:none; border-radius:8px;
         padding:10px 16px; font-weight:bold; font-size:14px; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.gris { background:var(--gris); color:var(--texte); }
  #auth .btn { width:100%; margin:6px 0 0; }
  #btnOublie { background:none; border:none; color:#0095f6; font-size:13px;
               margin-top:12px; cursor:pointer; }
  #msg { color:#ed4956; font-size:13px; min-height:18px; }
  #msg.ok { color:#2e7d32; }

  #barre { width:calc(100% - 24px); max-width:500px; margin:12px auto 0; display:none; }
  #recherche { width:100%; padding:11px 14px; border:1px solid var(--bord); border-radius:20px;
               background:var(--gris); font-size:14px; }

  #creer { width:calc(100% - 24px); max-width:500px; margin:14px auto; display:none; }
  .creerCarte { background:var(--gris); border-radius:14px; padding:22px 14px;
                text-align:center; cursor:pointer; }
  .creerCarte svg { width:34px; height:34px; }
  .creerTitre { font-weight:bold; font-size:17px; margin-top:8px; }
  .creerSous { color:var(--grisTexte); font-size:14px; margin-top:4px; }

  #publier { width:calc(100% - 24px); max-width:500px; margin:14px auto; padding:14px;
             background:var(--carte); border:1px solid var(--bord); border-radius:10px; display:none; }
  #publier input[type=text] { width:100%; padding:10px; margin:10px 0;
             border:1px solid var(--bord); border-radius:6px; font-size:14px; }
  #photo, #video { display:none; }
  .fichier { display:inline-block; padding:10px 14px; border-radius:8px; margin-right:6px;
             background:var(--gris); font-weight:bold; font-size:14px; cursor:pointer; }
  #etat { display:block; font-size:13px; margin-top:8px; }

  #onglets { width:calc(100% - 24px); max-width:500px; margin:0 auto; display:none; gap:8px; }
  .ong { flex:1; padding:9px; border:none; border-radius:8px; background:var(--gris);
         font-weight:bold; font-size:14px; cursor:pointer; color:var(--texte); }
  .ong.actif { background:#0095f6; color:#fff; }

  .titre { max-width:500px; margin:14px auto 0; padding:0 12px; font-weight:bold; font-size:18px; }

  .resultat { max-width:500px; margin:8px auto; padding:10px 12px; background:var(--carte);
              border:1px solid var(--bord); border-radius:10px; display:flex;
              align-items:center; gap:10px; cursor:pointer; }
  .dernier { font-size:13px; color:var(--grisTexte); margin-top:2px; }

  .post { background:var(--carte); max-width:500px; margin:14px auto;
          border:1px solid var(--bord); border-radius:10px; overflow:hidden; }
  .entete { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; }
  .avatar { width:34px; height:34px; border-radius:50%; color:#fff; font-weight:bold;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            background:linear-gradient(45deg,#f09433,#dc2743,#bc1888); }
  img.avatar { display:block; object-fit:cover; background:var(--gris); }
  .avatar.grand { width:72px; height:72px; font-size:30px; }
  .nom { font-weight:bold; font-size:14px; }
  .heure { font-size:12px; color:var(--grisTexte); margin-top:2px; }
  .suppr { margin-left:auto; background:none; border:none; font-size:20px; cursor:pointer; padding:4px 6px; }
  .signaler { font-size:16px; opacity:.7; }
  .post img.photo { width:100%; display:block; background:var(--gris); }
  .post video { width:100%; display:block; background:#000; max-height:80vh; }

  /* Plusieurs photos : on fait défiler avec le doigt */
  .carr { position:relative; }
  .defil { display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
           -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .defil::-webkit-scrollbar { display:none; }
  .defil img { flex:0 0 100%; width:100%; scroll-snap-align:start; display:block;
               background:var(--gris); }
  .compteur { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); color:#fff;
              font-size:12px; font-weight:bold; padding:3px 9px; border-radius:12px; }

  .actions { padding:10px 12px 4px; font-size:26px; }
  .coeur { cursor:pointer; }
  .nblikes { font-size:14px; font-weight:bold; margin-left:8px; cursor:pointer; }
  .legende, .com { padding:2px 12px; font-size:14px; line-height:1.4; word-wrap:break-word; }
  .nouveau { display:flex; gap:8px; padding:10px 12px 12px; border-top:1px solid var(--gris); margin-top:8px; }
  .nouveau input { flex:1; padding:9px; border:1px solid var(--bord); border-radius:6px; }
  .nouveau button { background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer; }

  .retour { max-width:500px; margin:10px auto 0; padding:0 12px; }
  .retour button { background:none; border:none; color:#0095f6; font-weight:bold;
                   font-size:14px; cursor:pointer; padding:6px 0; }
  .profil-tete { max-width:500px; margin:8px auto 14px; padding:16px; background:var(--carte);
                 border:1px solid var(--bord); border-radius:10px;
                 display:flex; align-items:center; gap:16px; }
  .profil-nom { font-size:18px; font-weight:bold; }
  .profil-nb { font-size:13px; color:var(--grisTexte); margin-top:4px; line-height:1.5; }
  .profil-tete .btn { margin-top:8px; padding:8px 14px; }
  .change { display:inline-block; margin-top:8px; padding:7px 12px; border-radius:8px;
            background:var(--gris); font-weight:bold; font-size:13px; cursor:pointer; }
  .petit { font-size:12px; color:var(--grisTexte); margin-left:6px; }
  .grille { max-width:500px; margin:0 auto 24px; display:grid;
            grid-template-columns:repeat(3,1fr); gap:3px; }
  .grille img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--gris); }
  .cell { position:relative; }
  .cell .play { position:absolute; right:6px; top:6px; color:#fff; font-size:16px;
                text-shadow:0 0 4px #000; }
  .vide { text-align:center; color:var(--grisTexte); padding:20px; font-size:14px; }

  #fenetre { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
             z-index:20; display:none; align-items:center; justify-content:center; }
  #boite { background:var(--carte); color:var(--texte); width:90%; max-width:400px; max-height:70vh;
           border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  #boiteTete { display:flex; justify-content:space-between; align-items:center;
               padding:12px 14px; border-bottom:1px solid var(--bord); }
  #boiteTete button { border:none; background:none; font-size:18px; cursor:pointer; color:var(--texte); }
  #boiteListe { overflow-y:auto; padding:6px 0; }
  .qui { display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer; }
  .qui.nonlu { background:var(--bleuClair); }
  .qui .texte { font-size:14px; line-height:1.35; }
  .qui .quand { font-size:12px; color:var(--grisTexte); margin-top:2px; }

  /* Messages privés */
  #chat { max-width:500px; margin:8px auto 24px; background:var(--carte);
          border:1px solid var(--bord); border-radius:10px; overflow:hidden; }
  .chat-tete { display:flex; align-items:center; gap:10px; padding:10px 12px;
               border-bottom:1px solid var(--bord); }
  #messages { display:flex; flex-direction:column; height:50vh; overflow-y:auto; padding:10px 12px; }
  .bulle { max-width:75%; padding:8px 12px; border-radius:16px; margin:3px 0;
           font-size:14px; line-height:1.35; word-wrap:break-word; background:var(--gris); }
  .bulle.moi { margin-left:auto; background:#0095f6; color:#fff; }
  .chat-saisie { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--bord); }
  .chat-saisie input { flex:1; min-width:0; padding:10px; border:1px solid var(--bord);
                       border-radius:20px; font-size:14px; }
  .chat-saisie button { background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer; }

  /* Barre du bas */
  #nav { position:fixed; bottom:0; left:0; right:0; height:56px; background:var(--carte);
         border-top:1px solid var(--bord); display:flex; justify-content:space-around;
         align-items:center; z-index:6; }
  #nav button { background:none; border:none; color:var(--texte); padding:8px 14px;
                position:relative; cursor:pointer; }
  #nav button.actif { color:#c13584; }
  #nav svg { width:26px; height:26px; display:block; }
  .badge { position:absolute; top:2px; right:4px; background:#ed4956; color:#fff; font-size:10px;
           font-weight:bold; border-radius:10px; min-width:16px; height:16px; line-height:16px;
           text-align:center; padding:0 4px; display:none; }
</style>
</head>
<body>

<div id="auth">
  <button class="btnTheme petitTheme" type="button">🌙</button>
  <div class="logo">Vybora</div>
  <input id="pseudo" type="text" maxlength="20" placeholder="Pseudo (seulement pour s'inscrire)">
  <input id="email" type="email" placeholder="Email">
  <input id="mdp" type="password" placeholder="Mot de passe (8 caractères min.)">
  <button class="btn" id="btnConnecter">Se connecter</button>
  <button class="btn gris" id="btnInscrire">S'inscrire</button>
  <button id="btnOublie" type="button">Mot de passe oublié ?</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none">
  <header>
    <span class="logo" id="logo">Vybora</span>
    <div class="tete-droite">
      <button class="btnTheme" type="button">🌙</button>
      <button class="iconeTete" id="btnMsgs" type="button" aria-label="Messages">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </header>

  <div id="barre">
    <input id="recherche" type="search" maxlength="30" placeholder="🔍 Rechercher une personne...">
  </div>

  <div id="creer">
    <div class="creerCarte" id="creerCarte">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      <div class="creerTitre">Créer une publication</div>
      <div class="creerSous">Photos ou vidéo</div>
    </div>
  </div>

  <div id="publier">
    <label class="fichier" for="photo">📷 Photos</label>
    <input id="photo" type="file" accept="image/*" multiple>
    <label class="fichier" for="video">🎬 Vidéo</label>
    <input id="video" type="file" accept="video/*">
    <span id="etat"></span>
    <input id="legende" type="text" maxlength="300" placeholder="Écris une légende...">
    <button class="btn" id="btnPublier">Publier</button>
  </div>

  <div id="onglets">
    <button class="ong actif" id="ongTous">Tous</button>
    <button class="ong" id="ongAbos">Abonnements</button>
  </div>

  <div id="fil"></div>

  <nav id="nav">
    <button id="navAccueil" type="button" aria-label="Accueil">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button id="navRecherche" type="button" aria-label="Recherche">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
    <button id="navVideos" type="button" aria-label="Vidéos">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
    </button>
    <button id="navNotif" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <span class="badge" id="badgeNotif">0</span>
    </button>
    <button id="navProfil" type="button" aria-label="Profil">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
  </nav>
</div>

<div id="fenetre">
  <div id="boite">
    <div id="boiteTete"><b id="boiteTitre">Mentions J'aime</b><button id="fermer">✕</button></div>
    <div id="boiteListe"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, where,
         serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3fKtSOEQb7RbFQaOShAQ2__hjuWCsHVU",
  authDomain: "photogram-98606.firebaseapp.com",
  projectId: "photogram-98606",
  storageBucket: "photogram-98606.firebasestorage.app",
  messagingSenderId: "402209948551",
  appId: "1:402209948551:web:7330d1625695eee2e50922"
};

// Cloudinary (stockage des vidéos)
const CLOUD = "kwxwbmxg";
const PRESET = "vybora_videos";
const VIDEO_MAX_MO = 40;
const VIDEO_MAX_SEC = 60;
const PHOTOS_MAX = 4;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let arrets = [];
let docs = [];
let videosDocs = [];
let photos = {};
let suivis = {};
let pseudosListe = {};
let notifs = [];
let convs = [];
let profilActuel = null;
let vue = "accueil";
let onglet = "tous";
let vueConvs = false;
let formOuvert = false;
let recherche = "";
let dernierePub = 0;
let dernierCom = 0;
let dernierMsg = 0;
let convActuelle = null;
let messagesConv = [];
let arretMessages = null;

// Mode sombre / clair
function majTheme() {
  const sombre = document.documentElement.classList.contains("sombre");
  document.querySelectorAll(".btnTheme").forEach(b => {
    b.textContent = sombre ? "☀️" : "🌙";
  });
}
function basculerTheme() {
  const sombre = document.documentElement.classList.toggle("sombre");
  try { localStorage.setItem("theme", sombre ? "sombre" : "clair"); } catch (e) {}
  majTheme();
}
document.querySelectorAll(".btnTheme").forEach(b => { b.onclick = basculerTheme; });
majTheme();

function nomUtilisateur() {
  const u = auth.currentUser;
  return u.displayName || u.email.split("@")[0];
}

// Temps écoulé depuis une publication
function depuis(ms) {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "à l'instant";
  const m = Math.floor(s / 60);
  if (m < 60) return "il y a " + m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return "il y a " + h + " h";
  const j = Math.floor(h / 24);
  if (j < 7) return "il y a " + j + (j > 1 ? " jours" : " jour");
  return new Date(ms).toLocaleDateString("fr-FR");
}

setInterval(() => {
  document.querySelectorAll(".heure").forEach(e => {
    e.textContent = depuis(Number(e.dataset.ms));
  });
}, 30000);

// Réserve le pseudo d'un ancien compte s'il est encore libre
async function reserver(nom) {
  try {
    const ref = doc(db, "pseudos", nom.toLowerCase());
    const s = await getDoc(ref);
    if (!s.exists()) await setDoc(ref, { uid: auth.currentUser.uid, nom: nom });
  } catch (e) {}
}

// Envoie une notification à une personne (si on connaît son compte)
function notifier(pourPseudo, type, extra, id) {
  try {
    const cible = pseudosListe[(pourPseudo || "").toLowerCase()];
    if (!cible || !cible.uid || cible.uid === auth.currentUser.uid) return;
    const data = Object.assign({
      pourUid: cible.uid,
      deUid: auth.currentUser.uid,
      de: nomUtilisateur(),
      type: type,
      date: serverTimestamp(),
      lu: false
    }, extra || {});
    if (id) {
      setDoc(doc(db, "notifs", id), data).catch(() => {});
    } else {
      addDoc(collection(db, "notifs"), data).catch(() => {});
    }
  } catch (e) {}
}

$("btnInscrire").onclick = async () => {
  $("msg").className = "";
  const pseudo = $("pseudo").value.trim();
  if (!/^[A-Za-z0-9_.-]{3,20}$/.test(pseudo)) {
    $("msg").textContent = "Pseudo : 3 à 20 caractères (lettres, chiffres, _ . -)";
    return;
  }
  if ($("mdp").value.length < 8) {
    $("msg").textContent = "Mot de passe : 8 caractères minimum";
    return;
  }
  $("msg").textContent = "";
  const cle = pseudo.toLowerCase();
  try {
    const existe = await getDoc(doc(db, "pseudos", cle));
    if (existe.exists()) {
      $("msg").textContent = "Ce pseudo est déjà pris";
      return;
    }
    const cred = await createUserWithEmailAndPassword(auth, $("email").value, $("mdp").value);
    try {
      await setDoc(doc(db, "pseudos", cle), { uid: cred.user.uid, nom: pseudo });
    } catch (e) {
      await cred.user.delete();
      $("msg").textContent = "Ce pseudo est déjà pris";
      return;
    }
    await updateProfile(cred.user, { displayName: pseudo });
  } catch (e) {
    $("msg").textContent = e.code;
  }
};

$("btnConnecter").onclick = () => {
  $("msg").className = "";
  signInWithEmailAndPassword(auth, $("email").value, $("mdp").value)
    .catch(e => $("msg").textContent = e.code);
};

// Mot de passe oublié : envoie un email de réinitialisation
$("btnOublie").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) {
    $("msg").className = "";
    $("msg").textContent = "Écris ton email dans le champ Email, puis réessaie";
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    $("msg").className = "ok";
    $("msg").textContent = "Email envoyé ! Vérifie ta boîte de réception et tes spams.";
  } catch (e) {
    $("msg").className = "";
    $("msg").textContent = e.code;
  }
};

// Navigation : barre du bas et en-tête
function aller(v) {
  fermerConv();
  profilActuel = null;
  vueConvs = false;
  vue = v;
  if (v !== "recherche") {
    recherche = "";
    $("recherche").value = "";
  }
  rendre();
  window.scrollTo(0, 0);
  if (v === "recherche") $("recherche").focus();
}

$("logo").onclick = () => aller("accueil");
$("navAccueil").onclick = () => aller("accueil");
$("navRecherche").onclick = () => aller("recherche");
$("navVideos").onclick = () => aller("videos");
$("navNotif").onclick = () => voirNotifs();
$("navProfil").onclick = () => ouvrirProfil(nomUtilisateur());
$("btnMsgs").onclick = () => {
  fermerConv();
  profilActuel = null;
  vueConvs = true;
  rendre();
  window.scrollTo(0, 0);
};
$("creerCarte").onclick = () => { formOuvert = !formOuvert; rendre(); };
$("ongTous").onclick = () => { onglet = "tous"; rendre(); };

// Réduit la photo. Si on envoie plusieurs photos, elles sont plus légères
// pour que la publication reste sous la limite de Firebase.
function reduirePhoto(fichier, petite) {
  return new Promise((ok, erreur) => {
    const lecteur = new FileReader();
    lecteur.onerror = erreur;
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = erreur;
      img.onload = () => {
        const essais = petite
          ? [[480, 0.5], [400, 0.45], [320, 0.4], [260, 0.35]]
          : [[600, 0.6], [500, 0.5], [400, 0.45], [320, 0.4]];
        const seuil = petite ? 130000 : 350000;
        const limite = petite ? 180000 : 440000;
        let resultat = "";
        for (let i = 0; i < essais.length; i++) {
          const max = essais[i][0];
          const q = essais[i][1];
          const echelle = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * echelle));
          c.height = Math.max(1, Math.round(img.height * echelle));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resultat = c.toDataURL("image/jpeg", q);
          if (resultat.length < seuil) break;
        }
        if (resultat.length >= limite) erreur(new Error("photo trop grande"));
        else ok(resultat);
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

// Photo de profil : carré recadré au centre
function reduireCarre(fichier, taille) {
  return new Promise((ok, erreur) => {
    const lecteur = new FileReader();
    lecteur.onerror = erreur;
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = erreur;
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = taille;
        c.height = taille;
        const cote = Math.min(img.width, img.height);
        const sx = (img.width - cote) / 2;
        const sy = (img.height - cote) / 2;
        c.getContext("2d").drawImage(img, sx, sy, cote, cote, 0, 0, taille, taille);
        ok(c.toDataURL("image/jpeg", 0.7));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

// Durée d'une vidéo en secondes (0 si on ne peut pas la lire)
function dureeVideo(fichier) {
  return new Promise(res => {
    const v = document.createElement("video");
    v.preload = "metadata";
    const u = URL.createObjectURL(fichier);
    v.onloadedmetadata = () => { URL.revokeObjectURL(u); res(v.duration || 0); };
    v.onerror = () => { URL.revokeObjectURL(u); res(0); };
    v.src = u;
  });
}

// Envoie la vidéo sur Cloudinary et renvoie son lien
function envoyerVideo(fichier, progression) {
  return new Promise((ok, erreur) => {
    const fd = new FormData();
    fd.append("file", fichier);
    fd.append("upload_preset", PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUD + "/video/upload");
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) progression(Math.round(e.loaded * 100 / e.total));
    };
    xhr.onload = () => {
      let rep = {};
      try { rep = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300 && rep.secure_url) ok(rep.secure_url);
      else erreur(new Error((rep.error && rep.error.message) || ("erreur " + xhr.status)));
    };
    xhr.onerror = () => erreur(new Error("problème de connexion"));
    xhr.send(fd);
  });
}

// Image d'aperçu d'une vidéo Cloudinary
function miniature(url) {
  return String(url).replace(/\.[A-Za-z0-9]+$/, ".jpg");
}

function videoValide(url) {
  return typeof url === "string" && url.startsWith("https://res.cloudinary.com/");
}

// Toutes les photos d'une publication (la première + les suivantes)
function toutesPhotos(p) {
  const liste = [];
  if (typeof p.img === "string" && p.img.startsWith("data:image/")) liste.push(p.img);
  if (Array.isArray(p.plus)) {
    p.plus.forEach(x => {
      if (typeof x === "string" && x.startsWith("data:image/")) liste.push(x);
    });
  }
  return liste;
}

$("btnPublier").onclick = async () => {
  const lesPhotos = Array.from($("photo").files);
  const fichierVideo = $("video").files[0];
  const estVideo = !!fichierVideo;
  if (!estVideo && lesPhotos.length === 0) {
    $("etat").textContent = "Choisis une photo ou une vidéo d'abord";
    return;
  }
  if (estVideo) {
    if (!fichierVideo.type.startsWith("video/")) {
      $("etat").textContent = "Ce fichier n'est pas une vidéo";
      return;
    }
    if (fichierVideo.size > VIDEO_MAX_MO * 1024 * 1024) {
      $("etat").textContent = "Vidéo trop lourde (" + VIDEO_MAX_MO + " Mo maximum)";
      return;
    }
  } else {
    if (lesPhotos.length > PHOTOS_MAX) {
      $("etat").textContent = PHOTOS_MAX + " photos maximum par publication";
      return;
    }
    for (const f of lesPhotos) {
      if (!f.type.startsWith("image/")) {
        $("etat").textContent = "Un des fichiers n'est pas une image";
        return;
      }
      if (f.size > 15 * 1024 * 1024) {
        $("etat").textContent = "Une photo est trop lourde (15 Mo maximum)";
        return;
      }
    }
  }
  if (Date.now() - dernierePub < 15000) {
    $("etat").textContent = "Attends quelques secondes avant de republier";
    return;
  }
  $("btnPublier").disabled = true;
  $("etat").textContent = "Publication...";
  try {
    if (estVideo) {
      const d = await dureeVideo(fichierVideo);
      if (d > VIDEO_MAX_SEC) throw new Error("vidéo trop longue (" + VIDEO_MAX_SEC + " secondes maximum)");
      $("etat").textContent = "Envoi de la vidéo... 0 %";
      const url = await envoyerVideo(fichierVideo, p => {
        $("etat").textContent = "Envoi de la vidéo... " + p + " %";
      });
      await addDoc(collection(db, "videos"), {
        user: nomUtilisateur(),
        texte: $("legende").value.trim().slice(0, 300),
        video: url,
        likes: [],
        commentaires: [],
        date: serverTimestamp()
      });
    } else {
      const petite = lesPhotos.length > 1;
      const liste = [];
      for (let i = 0; i < lesPhotos.length; i++) {
        if (petite) $("etat").textContent = "Préparation des photos... " + (i + 1) + "/" + lesPhotos.length;
        liste.push(await reduirePhoto(lesPhotos[i], petite));
      }
      const total = liste.reduce((s, x) => s + x.length, 0);
      if (total > 900000) throw new Error("photos trop lourdes, essaie avec moins de photos");
      const data = {
        user: nomUtilisateur(),
        texte: $("legende").value.trim().slice(0, 300),
        img: liste[0],
        likes: [],
        commentaires: [],
        date: serverTimestamp()
      };
      if (liste.length > 1) data.plus = liste.slice(1);
      await addDoc(collection(db, "posts"), data);
    }
    dernierePub = Date.now();
    $("photo").value = "";
    $("video").value = "";
    $("legende").value = "";
    $("etat").textContent = "";
    formOuvert = false;
    rendre();
  } catch (e) {
    if (estVideo && e.code === "permission-denied") {
      $("etat").textContent = "Erreur : les règles Firebase des vidéos ne sont pas encore publiées";
    } else if (e.code === "permission-denied") {
      $("etat").textContent = "Erreur : les règles Firebase des photos multiples ne sont pas encore publiées";
    } else {
      $("etat").textContent = "Erreur : " + (e.code || e.message || "impossible");
    }
  }
  $("btnPublier").disabled = false;
};

function afficherFil() {
  const q = query(collection(db, "posts"), orderBy("date", "desc"));
  arrets.push(onSnapshot(q, snap => {
    docs = snap.docs;
    rendre();
  }));
  const qv = query(collection(db, "videos"), orderBy("date", "desc"));
  arrets.push(onSnapshot(qv, snap => {
    videosDocs = snap.docs;
    rendre();
  }, () => {}));
  arrets.push(onSnapshot(collection(db, "profils"), snap => {
    photos = {};
    snap.forEach(d => { photos[d.id] = d.data().img; });
    rendre();
  }, () => {}));
  arrets.push(onSnapshot(collection(db, "suivis"), snap => {
    suivis = {};
    snap.forEach(d => { suivis[d.id] = d.data().liste || []; });
    rendre();
  }, () => {}));
  arrets.push(onSnapshot(collection(db, "pseudos"), snap => {
    pseudosListe = {};
    snap.forEach(d => {
      pseudosListe[d.id] = { nom: d.data().nom || d.id, uid: d.data().uid };
    });
    rendre();
  }, () => {}));
  const qn = query(collection(db, "notifs"), where("pourUid", "==", auth.currentUser.uid));
  arrets.push(onSnapshot(qn, snap => {
    notifs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    majCloche();
  }, () => {}));
  const qc = query(collection(db, "conversations"),
                   where("participants", "array-contains", auth.currentUser.uid));
  arrets.push(onSnapshot(qc, snap => {
    convs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (vueConvs && !convActuelle) rendre();
  }, () => {}));
}

// Photos et vidéos ensemble, les plus récentes d'abord
function msDoc(d) {
  const t = d.data().date;
  return t && t.toMillis ? t.toMillis() : Date.now();
}
function tousPosts() {
  return docs.concat(videosDocs).sort((a, b) => msDoc(b) - msDoc(a));
}

// Pastille rouge sur le cœur avec le nombre de notifications non lues
function majCloche() {
  const n = notifs.filter(x => !x.lu).length;
  const b = $("badgeNotif");
  b.textContent = n > 9 ? "9+" : String(n);
  b.style.display = n > 0 ? "block" : "none";
}

function msNotif(n) {
  return n.date && n.date.toMillis ? n.date.toMillis() : Date.now();
}

// Fenêtre des notifications
function voirNotifs() {
  $("boiteTitre").textContent = "Notifications";
  const liste = $("boiteListe");
  liste.innerHTML = "";

  const triees = notifs.slice().sort((a, b) => msNotif(b) - msNotif(a)).slice(0, 30);

  if (triees.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Aucune notification pour l'instant";
    liste.append(v);
  }

  triees.forEach(n => {
    const ligne = document.createElement("div");
    ligne.className = "qui" + (n.lu ? "" : " nonlu");
    ligne.onclick = () => {
      $("fenetre").style.display = "none";
      ouvrirProfil(n.de);
    };

    const corps = document.createElement("div");
    const texte = document.createElement("div");
    texte.className = "texte";
    const nom = document.createElement("b");
    nom.textContent = n.de + " ";
    let action = "";
    if (n.type === "like") action = "a aimé ta publication";
    else if (n.type === "com") action = "a commenté : « " + (n.texte || "") + " »";
    else if (n.type === "abo") action = "s'est abonné à toi";
    texte.append(nom, document.createTextNode(action));
    const quand = document.createElement("div");
    quand.className = "quand";
    quand.textContent = depuis(msNotif(n));
    corps.append(texte, quand);

    ligne.append(avatar(n.de, false), corps);
    liste.append(ligne);
  });

  $("fenetre").style.display = "flex";

  // Marque tout comme lu
  notifs.filter(n => !n.lu).forEach(n => {
    updateDoc(doc(db, "notifs", n.id), { lu: true }).catch(() => {});
  });
}

  fermerConv();

  profilActuel = nom;
  recherche = "";
  $("recherche").value = "";

}

// Pastille ou photo de profil
function avatar(nom, grand) {
  const img = photos[(nom || "").toLowerCase()];
  if (img && String(img).startsWith("data:image/")) {
    const im = document.createElement("img");
    im.className = "avatar" + (grand ? " grand" : "");
    im.src = img;
    return im;
  }
  const d = document.createElement("div");
  d.className = "avatar" + (grand ? " grand" : "");
  d.textContent = (nom || "?").charAt(0).toUpperCase();
  return d;
}

function pluriel(n, mot) {
  return n + " " + mot + (n > 1 ? "s" : "");
}

// Fenêtre « qui a aimé »
function voirLikes(likes) {
  $("boiteTitre").textContent = "Mentions J'aime";
  const liste = $("boiteListe");
  liste.innerHTML = "";

  if (likes.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Personne n'a encore aimé cette publication";
    liste.append(v);
  } else {
    const parUid = {};
    Object.values(pseudosListe).forEach(x => { parUid[x.uid] = x.nom; });
    const noms = likes.map(u => parUid[u]).filter(Boolean);

    noms.forEach(n => {
      const ligne = document.createElement("div");
      ligne.className = "qui";
      ligne.onclick = () => {
        $("fenetre").style.display = "none";
        ouvrirProfil(n);
      };
      const nom = document.createElement("div");
      nom.className = "nom";
      nom.textContent = n;
      ligne.append(avatar(n, false), nom);
      liste.append(ligne);
    });

    const inconnus = likes.length - noms.length;
    if (inconnus > 0) {
      const v = document.createElement("div");
      v.className = "vide";
      v.textContent = "+ " + pluriel(inconnus, "autre personne");
      liste.append(v);
    }
  }
  $("fenetre").style.display = "flex";
}

// Tous les pseudos connus (avec leurs majuscules quand c'est possible)
function tousLesNoms() {
  const carte = {};
  Object.keys(pseudosListe).forEach(k => { carte[k] = pseudosListe[k].nom; });
  tousPosts().forEach(d => {
    const u = d.data().user;
    if (u) carte[u.toLowerCase()] = u;
  });
  carte[nomUtilisateur().toLowerCase()] = nomUtilisateur();
  return Object.values(carte);
}

function rendreRecherche() {
  const q = recherche.trim().toLowerCase();
  const trouves = tousLesNoms()
    .filter(n => n.toLowerCase().includes(q))
    .sort((a, b) => {
      const sa = a.toLowerCase().startsWith(q) ? 0 : 1;
      const sb = b.toLowerCase().startsWith(q) ? 0 : 1;
      return sa - sb || a.localeCompare(b);
    })
    .slice(0, 20);

  if (trouves.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Aucune personne trouvée pour « " + recherche.trim() + " »";
    $("fil").append(v);
    return;
  }

  trouves.forEach(n => {
    const ligne = document.createElement("div");
    ligne.className = "resultat";
    ligne.onclick = () => ouvrirProfil(n);
    const nom = document.createElement("div");
    nom.className = "nom";
    nom.textContent = n;
    ligne.append(avatar(n, false), nom);
    $("fil").append(ligne);
  });
}

// ---------- Messages privés ----------

function fermerConv() {
  convActuelle = null;
  messagesConv = [];
  if (arretMessages) { arretMessages(); arretMessages = null; }
}

function ouvrirConv(nom) {
  const cible = pseudosListe[(nom || "").toLowerCase()];
  if (!cible || !cible.uid) {
    alert("Cette personne doit d'abord se reconnecter une fois pour pouvoir recevoir des messages.");
    return;
  }
  const participants = [auth.currentUser.uid, cible.uid].sort();
  convActuelle = {
    id: participants.join("_"),
    avec: cible.nom || nom,
    avecUid: cible.uid,
    participants: participants
  };
  messagesConv = [];
  if (arretMessages) arretMessages();
  const q = query(collection(db, "conversations", convActuelle.id, "messages"), orderBy("date"));
  arretMessages = onSnapshot(q, snap => {
    messagesConv = snap.docs.map(d => d.data());
    majMessages();
  }, () => {
    messagesConv = [];
    majMessages();
  });
  rendre();
  window.scrollTo(0, 0);
}

function majMessages() {
  const zone = $("messages");
  if (!zone) return;
  zone.innerHTML = "";
  if (messagesConv.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Aucun message. Dis bonjour 👋";
    zone.append(v);
    return;
  }
  const moi = auth.currentUser.uid;
  messagesConv.forEach(m => {
    const b = document.createElement("div");
    b.className = "bulle" + (m.de === moi ? " moi" : "");
    b.textContent = m.texte;
    zone.append(b);
  });
  zone.scrollTop = zone.scrollHeight;
}

async function envoyer(champ) {
  const c = convActuelle;
  if (!c) return;
  const t = champ.value.trim().slice(0, 500);
  if (!t) return;
  if (Date.now() - dernierMsg < 700) return;
  dernierMsg = Date.now();
  champ.value = "";
  const noms = {};
  noms[auth.currentUser.uid] = nomUtilisateur();
  noms[c.avecUid] = c.avec;
  try {
    await setDoc(doc(db, "conversations", c.id), {
      participants: c.participants,
      noms: noms,
      dernier: t.slice(0, 60),
      date: serverTimestamp()
    }, { merge: true });
    await addDoc(collection(db, "conversations", c.id, "messages"), {
      de: auth.currentUser.uid,
      deNom: nomUtilisateur(),
      texte: t,
      date: serverTimestamp()
    });
  } catch (e) {
    alert("Message non envoyé : " + (e.code || "erreur"));
    champ.value = t;
  }
}

function rendreConv() {
  const c = convActuelle;

  const retour = document.createElement("div");
  retour.className = "retour";
  const br = document.createElement("button");
  br.textContent = "← Retour";
  br.onclick = () => { fermerConv(); rendre(); window.scrollTo(0, 0); };
  retour.append(br);

  const boite = document.createElement("div");
  boite.id = "chat";

  const tete = document.createElement("div");
  tete.className = "chat-tete";
  const nom = document.createElement("div");
  nom.className = "nom";
  nom.textContent = c.avec;
  tete.append(avatar(c.avec, false), nom);

  const zone = document.createElement("div");
  zone.id = "messages";

  const saisie = document.createElement("div");
  saisie.className = "chat-saisie";
  const champ = document.createElement("input");
  champ.type = "text";
  champ.maxLength = 500;
  champ.placeholder = "Écrire un message...";
  champ.onkeydown = e => { if (e.key === "Enter") envoyer(champ); };
  const bouton = document.createElement("button");
  bouton.textContent = "Envoyer";
  bouton.onclick = () => envoyer(champ);
  saisie.append(champ, bouton);

  boite.append(tete, zone, saisie);
  $("fil").append(retour, boite);
  majMessages();
}

// Liste des conversations (avion en papier)
function rendreConvs() {
  const t = document.createElement("div");
  t.className = "titre";
  t.textContent = "Messages";
  $("fil").append(t);

  const moi = auth.currentUser.uid;
  const triees = convs.slice().sort((a, b) => {
    const ma = a.date && a.date.toMillis ? a.date.toMillis() : Date.now();
    const mb = b.date && b.date.toMillis ? b.date.toMillis() : Date.now();
    return mb - ma;
  });

  if (triees.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Aucune conversation. Va sur le profil d'un ami et appuie sur « ✉️ Message ».";
    $("fil").append(v);
    return;
  }

  triees.forEach(c => {
    const autre = (c.participants || []).find(u => u !== moi);
    const nom = (c.noms && c.noms[autre]) || "Utilisateur";
    const ms = c.date && c.date.toMillis ? c.date.toMillis() : Date.now();

    const ligne = document.createElement("div");
    ligne.className = "resultat";
    ligne.onclick = () => ouvrirConv(nom);

    const colonne = document.createElement("div");
    const n = document.createElement("div");
    n.className = "nom";
    n.textContent = nom;
    const d = document.createElement("div");
    d.className = "dernier";
    d.textContent = (c.dernier || "") + " · " + depuis(ms);
    colonne.append(n, d);

    ligne.append(avatar(nom, false), colonne);
    $("fil").append(ligne);
  });
}

// Met en couleur le bouton de la barre du bas qui correspond à la page
function majNav() {
  const moi = nomUtilisateur().toLowerCase();
  const surFil = !profilActuel && !convActuelle && !vueConvs;
  $("navAccueil").className = (surFil && vue === "accueil") ? "actif" : "";
  $("navRecherche").className = (surFil && vue === "recherche") ? "actif" : "";
  $("navVideos").className = (surFil && vue === "videos") ? "actif" : "";
  $("navProfil").className =
    (profilActuel && !convActuelle && profilActuel.toLowerCase() === moi) ? "actif" : "";
  $("btnMsgs").className = "iconeTete" + ((vueConvs || convActuelle) ? " actif" : "");
}

function rendre() {
  const dansConv = !!convActuelle;
  const surFil = !profilActuel && !dansConv && !vueConvs;
  const accueil = surFil && vue === "accueil";
  $("creer").style.display = accueil ? "block" : "none";
  $("publier").style.display = (accueil && formOuvert) ? "block" : "none";
  $("onglets").style.display = accueil ? "flex" : "none";
  $("barre").style.display = (surFil && vue === "recherche") ? "block" : "none";
  $("ongTous").className = "ong" + (onglet === "tous" ? " actif" : "");
  $("ongAbos").className = "ong" + (onglet === "abos" ? " actif" : "");
  majNav();

  // La conversation n'est reconstruite que si elle n'est pas déjà affichée
  // (sinon on perdrait le texte en cours d'écriture)
  if (dansConv) {
    if (!$("chat")) {
      $("fil").innerHTML = "";
      rendreConv();
    }
    return;
  }

  $("fil").innerHTML = "";
  if (profilActuel) { rendreProfil(); return; }
  if (vueConvs) { rendreConvs(); return; }
  if (vue === "recherche") { rendreRecherche(); return; }

  let liste = tousPosts();

  if (vue === "videos") {
    liste = liste.filter(d => videoValide(d.data().video));
    if (liste.length === 0) {
      const v = document.createElement("div");
      v.className = "vide";
      v.textContent = "Aucune vidéo pour le moment. Va sur l'accueil et appuie sur « Créer une publication » pour en ajouter une.";
      $("fil").append(v);
    }
    liste.forEach(d => $("fil").append(carte(d)));
    return;
  }

  if (onglet === "abos") {
    const moi = nomUtilisateur().toLowerCase();
    const mesAbos = suivis[moi] || [];
    if (mesAbos.length === 0) {
      const v = document.createElement("div");
      v.className = "vide";
      v.textContent = "Tu ne suis personne. Cherche une personne avec la loupe 🔍, ouvre son profil, puis appuie sur « S'abonner ».";
      $("fil").append(v);
    }
    liste = liste.filter(d => {
      const u = (d.data().user || "").toLowerCase();
      return u === moi || mesAbos.includes(u);
    });
  }
  liste.forEach(d => $("fil").append(carte(d)));
}

function rendreProfil() {
  const mes = tousPosts().filter(d => d.data().user === profilActuel);
  const moi = nomUtilisateur().toLowerCase();
  const cle = profilActuel.toLowerCase();
  const cestMoi = cle === moi;
  const jeSuis = (suivis[moi] || []).includes(cle);
  const abonnes = Object.keys(suivis).filter(k => suivis[k].includes(cle)).length;
  const abonnements = (suivis[cle] || []).length;

  const retour = document.createElement("div");
  retour.className = "retour";
  const br = document.createElement("button");
  br.textContent = "← Retour au fil";
  br.onclick = () => { profilActuel = null; rendre(); };
  retour.append(br);

  const tete = document.createElement("div");
  tete.className = "profil-tete";
  const av = avatar(profilActuel, true);
  const infos = document.createElement("div");
  const nom = document.createElement("div");
  nom.className = "profil-nom";
  nom.textContent = profilActuel;
  const nb = document.createElement("div");
  nb.className = "profil-nb";
  nb.textContent = pluriel(mes.length, "publication") + " · " +
                   pluriel(abonnes, "abonné") + " · " +
                   pluriel(abonnements, "abonnement");
  infos.append(nom, nb);

  if (cestMoi) {
    const lab = document.createElement("label");
    lab.className = "change";
    lab.textContent = "📷 Changer ma photo";
    const champ = document.createElement("input");
    champ.type = "file";
    champ.accept = "image/*";
    champ.style.display = "none";
    const info = document.createElement("span");
    info.className = "petit";
    champ.onchange = async () => {
      const f = champ.files[0];
      if (!f) return;
      if (!f.type.startsWith("image/") || f.size > 15 * 1024 * 1024) {
        info.textContent = "Image invalide ou trop lourde";
        return;
      }
      info.textContent = "Envoi...";
      try {
        const img = await reduireCarre(f, 200);
        await setDoc(doc(db, "profils", moi), { uid: auth.currentUser.uid, img: img });
        info.textContent = "";
      } catch (e) {
        info.textContent = "Erreur : " + (e.code || "photo invalide");
      }
    };
    lab.append(champ);
    const quitter = document.createElement("button");
    quitter.className = "btn gris";
    quitter.textContent = "Se déconnecter";
    quitter.onclick = () => signOut(auth);
    infos.append(lab, info, document.createElement("br"), quitter);
  } else {
    const bouton = document.createElement("button");
    bouton.className = "btn" + (jeSuis ? " gris" : "");
    bouton.textContent = jeSuis ? "Abonné ✓" : "S'abonner";
    bouton.onclick = async () => {
      try {
        await setDoc(doc(db, "suivis", moi), {
          uid: auth.currentUser.uid,
          liste: jeSuis ? arrayRemove(cle) : arrayUnion(cle)
        }, { merge: true });
        if (!jeSuis) {
          const cible = pseudosListe[cle];
          const idNotif = "abo_" + auth.currentUser.uid + "_" + (cible ? cible.uid : "x");
          notifier(profilActuel, "abo", {}, idNotif);
        }
      } catch (e) {
        alert("Erreur : " + (e.code || "impossible"));
      }
    };
    const message = document.createElement("button");
    message.className = "btn gris";
    message.style.marginLeft = "8px";
    message.textContent = "✉️ Message";
    message.onclick = () => ouvrirConv(profilActuel);
    infos.append(bouton, message);
  }

  tete.append(av, infos);
  $("fil").append(retour, tete);

  if (mes.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Aucune publication pour le moment";
    $("fil").append(v);
    return;
  }

  const grille = document.createElement("div");
  grille.className = "grille";
  mes.forEach(d => {
    const p = d.data();
    if (videoValide(p.video)) {
      const c = document.createElement("div");
      c.className = "cell";
      const im = document.createElement("img");
      im.src = miniature(p.video);
      const play = document.createElement("span");
      play.className = "play";
      play.textContent = "▶";
      c.append(im, play);
      grille.append(c);
    } else {
      const lesImgs = toutesPhotos(p);
      if (lesImgs.length === 0) return;
      const im = document.createElement("img");
      im.src = lesImgs[0];
      if (lesImgs.length > 1) {
        const c = document.createElement("div");
        c.className = "cell";
        const icone = document.createElement("span");
        icone.className = "play";
        icone.textContent = "❐";
        c.append(im, icone);
        grille.append(c);
      } else {
        grille.append(im);
      }
    }
  });
  $("fil").append(grille);
}

function carte(d) {
  const uid = auth.currentUser.uid;
  const p = d.data();
  const ref = d.ref;
  const likes = p.likes || [];
  const aime = likes.includes(uid);
  const cestMoi = (p.user || "").toLowerCase() === nomUtilisateur().toLowerCase();
  const ms = p.date && p.date.toMillis ? p.date.toMillis() : Date.now();

  const div = document.createElement("div");
  div.className = "post";

  const ent = document.createElement("div");
  ent.className = "entete";
  ent.onclick = () => ouvrirProfil(p.user);

  const colonne = document.createElement("div");
  const nom = document.createElement("div");
  nom.className = "nom";
  nom.textContent = p.user;
  const heure = document.createElement("div");
  heure.className = "heure";
  heure.dataset.ms = ms;
  heure.textContent = depuis(ms);
  colonne.append(nom, heure);

  ent.append(avatar(p.user, false), colonne);

  if (cestMoi) {
    const sup = document.createElement("button");
    sup.className = "suppr";
    sup.textContent = "🗑️";
    sup.onclick = async e => {
      e.stopPropagation();
      if (!confirm("Supprimer cette publication ?")) return;
      try {
        await deleteDoc(ref);
      } catch (err) {
        alert("Suppression impossible : " + err.code);
      }
    };
    ent.append(sup);
  } else {
    const sig = document.createElement("button");
    sig.className = "suppr signaler";
    sig.textContent = "🚩";
    sig.title = "Signaler";
    sig.onclick = async e => {
      e.stopPropagation();
      if (!confirm("Signaler cette publication ?")) return;
      try {
        await setDoc(doc(db, "signalements", d.id + "_" + uid), {
          postId: d.id,
          de: uid,
          auteur: p.user,
          date: serverTimestamp()
        });
        alert("Merci, la publication a été signalée.");
      } catch (err) {
        alert("Tu as déjà signalé cette publication, ou c'est impossible pour le moment.");
      }
    };
    ent.append(sig);
  }

  let media;
  const lesImgs = toutesPhotos(p);
  if (videoValide(p.video)) {
    media = document.createElement("video");
    media.className = "photo";
    media.src = p.video;
    media.poster = miniature(p.video);
    media.controls = true;
    media.preload = "metadata";
    media.setAttribute("playsinline", "");
  } else if (lesImgs.length > 1) {
    media = document.createElement("div");
    media.className = "carr";
    const defil = document.createElement("div");
    defil.className = "defil";
    lesImgs.forEach(src => {
      const im = document.createElement("img");
      im.src = src;
      defil.append(im);
    });
    const compteur = document.createElement("div");
    compteur.className = "compteur";
    compteur.textContent = "1/" + lesImgs.length;
    defil.onscroll = () => {
      const i = Math.round(defil.scrollLeft / Math.max(1, defil.clientWidth));
      compteur.textContent = (i + 1) + "/" + lesImgs.length;
    };
    media.append(defil, compteur);
  } else {
    media = document.createElement("img");
    media.className = "photo";
    media.src = lesImgs[0] || "";
  }

  const a = document.createElement("div");
  a.className = "actions";
  const coeur = document.createElement("span");
  coeur.className = "coeur";
  coeur.textContent = aime ? "❤️" : "🤍";
  coeur.onclick = () => {
    updateDoc(ref, { likes: aime ? arrayRemove(uid) : arrayUnion(uid) })
      .catch(err => alert("Impossible : " + err.code));
    if (!aime) notifier(p.user, "like", { postId: d.id }, "like_" + d.id + "_" + uid);
  };
  const nb = document.createElement("span");
  nb.className = "nblikes";
  nb.textContent = likes.length + " j'aime";
  nb.onclick = () => voirLikes(likes);
  a.append(coeur, nb);

  const l = document.createElement("div");
  l.className = "legende";
  const ln = document.createElement("b");
  ln.textContent = p.user + " ";
  l.append(ln, document.createTextNode(p.texte || ""));

  div.append(ent, media, a, l);

  (p.commentaires || []).forEach(c => {
    const ligne = document.createElement("div");
    ligne.className = "com";
    const cn = document.createElement("b");
    cn.textContent = c.user + " ";
    ligne.append(cn, document.createTextNode(c.texte));
    div.append(ligne);
  });

  const nouveau = document.createElement("div");
  nouveau.className = "nouveau";
  const champ = document.createElement("input");
  champ.type = "text";
  champ.maxLength = 300;
  champ.placeholder = "Ajouter un commentaire...";
  const bouton = document.createElement("button");
  bouton.textContent = "Publier";
  bouton.onclick = () => {
    const t = champ.value.trim().slice(0, 300);
    if (!t) return;
    if (Date.now() - dernierCom < 2000) return;
    dernierCom = Date.now();
    champ.value = "";
    updateDoc(ref, { commentaires: arrayUnion({ user: nomUtilisateur(), texte: t }) })
      .catch(err => alert("Impossible de commenter : " + err.code));
    notifier(p.user, "com", { postId: d.id, texte: t.slice(0, 60) });
  };
  nouveau.append(champ, bouton);
  div.append(nouveau);

  return div;
}
</script>
